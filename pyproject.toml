[project]
name = "ac-control-center"
version = "1.0.0"
description = "School AC control: central Flask server plus classroom Raspberry Pi clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "flask-mail>=0.10.0",
    "flask-limiter>=3.8.0",
    "werkzeug>=3.1.3",
    "sqlalchemy>=2.0.38",
    "email-validator>=2.2.0",
    "gunicorn>=23.0.0",
    "apscheduler>=3.11.0",
    "python-dotenv>=1.0.1",
    "pyngrok>=7.2.8",
    "requests>=2.32.3",
]

[project.optional-dependencies]
client = [
    "requests>=2.32.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ac-control = "ac_control.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ac_control*"]

[tool.setuptools.package-data]
ac_control = ["templates/*.html", "static/js/*.js", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
