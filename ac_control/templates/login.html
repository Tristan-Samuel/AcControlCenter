{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title text-center">AC Control Center</h3>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs mb-3" id="loginTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="password-tab" data-bs-toggle="tab" data-bs-target="#password-login" type="button" role="tab">
                            Password
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pin-tab" data-bs-toggle="tab" data-bs-target="#pin-login" type="button" role="tab">
                            Room PIN
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="password-login" role="tabpanel">
                        <form method="POST" id="passwordForm" action="{{ url_for('auth.login') }}">
                            <input type="hidden" name="login_type" value="password">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="passwordLoginBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                                    <span class="button-text">Login</span>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="pin-login" role="tabpanel">
                        <form method="POST" id="pinForm" action="{{ url_for('auth.login') }}">
                            <input type="hidden" name="login_type" value="pin">
                            <div class="mb-3">
                                <label for="room_number" class="form-label">Room Number</label>
                                <input type="text" class="form-control" id="room_number" name="room_number" required>
                            </div>
                            <div class="mb-3">
                                <label for="pin" class="form-label">PIN</label>
                                <input type="password" class="form-control" id="pin" name="pin"
                                       pattern="[0-9]{4}" maxlength="4" inputmode="numeric" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="pinLoginBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                                    <span class="button-text">Login with PIN</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                {% if config.ALLOW_PUBLIC_REGISTRATION %}
                <div class="text-center mt-3">
                    <p>New room? <a href="{{ url_for('auth.register') }}">Register here</a></p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
['passwordForm', 'pinForm'].forEach(function (formId) {
    const form = document.getElementById(formId);
    if (!form) return;
    form.addEventListener('submit', function () {
        const button = this.querySelector('button[type="submit"]');
        const spinner = button.querySelector('.spinner-border');
        const buttonText = button.querySelector('.button-text');
        spinner.classList.remove('d-none');
        buttonText.textContent = 'Logging in...';
        button.disabled = true;
    });
});
const pinInput = document.getElementById('pin');
if (pinInput) {
    pinInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
    });
}
</script>
{% endblock %}
